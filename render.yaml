services:
  - type: web
    name: kuro-helper-auth
    runtime: python
    plan: free
    buildCommand: pip install -r BOT/auth_server/requirements.txt
    startCommand: python BOT/bot.py
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: DISCORD_ADMIN_ROLE_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false